<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ローリング・メイズ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:"Hiragino Sans","Segoe UI",sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(10,20,50,.6);border:1px solid rgba(255,255,255,.2);padding:6px 14px;border-radius:20px;font-weight:bold;font-size:15px;backdrop-filter:blur(4px)}
#time.warn{color:#ff6b6b}
#overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,10,30,.65);text-align:center;padding:20px;cursor:pointer}
#overlay h1{font-size:clamp(32px,8vw,64px);background:linear-gradient(90deg,#7df9ff,#ffd86b,#ff7de9);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;filter:drop-shadow(0 0 12px rgba(125,249,255,.5))}
#overlay p{margin:6px 0;opacity:.9;line-height:1.6}
#overlay .btn{margin-top:18px;padding:12px 36px;border-radius:30px;background:linear-gradient(90deg,#3dd6ff,#a66bff);font-weight:bold;font-size:20px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#msg{position:fixed;top:40%;left:0;right:0;text-align:center;font-size:clamp(28px,7vw,56px);font-weight:bold;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 0 20px #ffd86b}
#joy{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);pointer-events:none;display:none;transform:translate(-50%,-50%)}
#knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(125,249,255,.7)}
#help{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:12px;opacity:.6;pointer-events:none}
</style>
</head>
<body>
<div id="hud"><div class="chip" id="lv">STAGE 1</div><div class="chip" id="time">⏱ 0</div><div class="chip" id="sc">SCORE 0</div><div class="chip" id="hi">HI 0</div></div>
<div id="msg"></div>
<div id="joy"><div id="knob"></div></div>
<div id="help">矢印キー/WASD または 画面ドラッグで転がす</div>
<div id="overlay">
  <h1>ROLLING MAZE</h1>
  <p>ボールを転がして <b style="color:#ffd86b">光るゴール</b> を目指そう！</p>
  <p>💎 宝石を拾うと +100点 & +3秒</p>
  <p>PC：矢印キー / WASD　スマホ：画面をドラッグ</p>
  <div class="btn">タップでスタート</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);
scene.fog = new THREE.Fog(0x0b1020, 30, 80);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

scene.add(new THREE.HemisphereLight(0x9ecbff,0x302040,0.9));
const sun = new THREE.DirectionalLight(0xffffff,2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// 床テクスチャ
function checkerTex(){
  const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  g.fillStyle='#2a3566';g.fillRect(0,0,128,128);
  g.fillStyle='#323f7a';g.fillRect(0,0,64,64);g.fillRect(64,64,64,64);
  g.strokeStyle='rgba(125,249,255,.25)';g.lineWidth=2;g.strokeRect(1,1,126,126);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t;
}
const floorTex = checkerTex();
const floor = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshStandardMaterial({map:floorTex,roughness:.8}));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

const W = 2, R = 0.45;
const wallGeo = new THREE.BoxGeometry(W,1.4,W);
const wallMat = new THREE.MeshStandardMaterial({color:0x8a7dff,roughness:.35,metalness:.1,emissive:0x1a1040});
let walls = null;

// ボール
const ballTex = (()=>{const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');
  g.fillStyle='#ff5a7a';g.fillRect(0,0,256,128);g.fillStyle='#fff';
  for(let i=0;i<8;i++){g.beginPath();g.arc(16+i*32,i%2?40:88,12,0,7);g.fill();}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;})();
const ball = new THREE.Mesh(new THREE.SphereGeometry(R,32,24), new THREE.MeshStandardMaterial({map:ballTex,roughness:.25,metalness:.2}));
ball.castShadow = true; scene.add(ball);
const ballLight = new THREE.PointLight(0xff7da0,4,5); scene.add(ballLight);

// ゴール
const goal = new THREE.Group();
const goalMat = new THREE.MeshStandardMaterial({color:0xffd86b,emissive:0xffb020,emissiveIntensity:2});
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.7,0.1,12,40), goalMat); ring.rotation.x=Math.PI/2; ring.position.y=0.1;
const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,6,24,1,true), new THREE.MeshBasicMaterial({color:0xffd86b,transparent:true,opacity:.18,side:THREE.DoubleSide,depthWrite:false}));
beam.position.y=3;
const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.35), goalMat); star.position.y=1.2;
goal.add(ring,beam,star, new THREE.PointLight(0xffc040,8,8));
scene.add(goal);

// 宝石
const gemGeo = new THREE.OctahedronGeometry(0.28);
const gemMat = new THREE.MeshStandardMaterial({color:0x7df9ff,emissive:0x20a0c0,emissiveIntensity:1.2,metalness:.3,roughness:.1});
const gemPool = []; let gems = [];

// パーティクル
const partGeo = new THREE.BoxGeometry(.12,.12,.12);
const parts = [];
for(let i=0;i<120;i++){const m=new THREE.Mesh(partGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true}));m.visible=false;scene.add(m);parts.push({m,v:new THREE.Vector3(),life:0});}
function burst(pos,color,n=20,spd=4){
  let k=0;for(const p of parts){if(p.life>0)continue;p.m.visible=true;p.m.position.copy(pos);p.m.material.color.set(color);
    p.v.set((Math.random()-.5)*spd,Math.random()*spd+1,(Math.random()-.5)*spd);p.life=1;if(++k>=n)break;}
}

// 背景の星
{const g=new THREE.BufferGeometry(),a=[];for(let i=0;i<600;i++)a.push((Math.random()-.5)*160,Math.random()*60+5,(Math.random()-.5)*160);
 g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xaaccff,size:.3})));}

// サウンド
let ac=null, rollGain=null, rollFilter=null;
function initAudio(){
  if(ac)return; ac=new (window.AudioContext||window.webkitAudioContext)();
  const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  rollFilter=ac.createBiquadFilter();rollFilter.type='lowpass';rollFilter.frequency.value=300;
  rollGain=ac.createGain();rollGain.gain.value=0;
  src.connect(rollFilter).connect(rollGain).connect(ac.destination);src.start();
}
function tone(f,dur=.15,type='sine',vol=.2,f2=f,delay=0){
  if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+dur);
}
const sfx={
  gem:()=>{tone(880,.1,'triangle',.2);tone(1320,.15,'triangle',.2,1320,.07);},
  bump:v=>tone(120,.08,'square',Math.min(.15,v*.03),60),
  goal:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.25,f,i*.1)),
  over:()=>[400,300,200].forEach((f,i)=>tone(f,.3,'sawtooth',.12,f*.9,i*.15)),
  tick:()=>tone(1000,.05,'square',.06)
};

// 迷路生成
let grid=[], S=0;
function genMaze(n){
  S=2*n+1; grid=Array.from({length:S},()=>Array(S).fill(1));
  const st=[[1,1]]; grid[1][1]=0;
  while(st.length){
    const [x,z]=st[st.length-1];
    const nb=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dz])=>{const nx=x+dx,nz=z+dz;return nx>0&&nz>0&&nx<S-1&&nz<S-1&&grid[nz][nx];});
    if(!nb.length){st.pop();continue;}
    const [dx,dz]=nb[Math.random()*nb.length|0];
    grid[z+dz/2][x+dx/2]=0;grid[z+dz][x+dx]=0;st.push([x+dx,z+dz]);
  }
  for(let i=0;i<n;i++){const x=1+(Math.random()*(S-2)|0),z=1+(Math.random()*(S-2)|0);
    if(grid[z][x]&&((x%2===1&&z%2===0)||(x%2===0&&z%2===1)))grid[z][x]=0;}
}
const cx=i=>(i-S/2+.5)*W;
const toCell=v=>Math.floor(v/W+S/2);

// 状態
const state={mode:'title',level:1,score:0,hi:0,time:0,vel:new THREE.Vector3()};
const goalPos=new THREE.Vector3();

function buildLevel(){
  const n=Math.min(4+state.level*2,16);
  genMaze(n);
  if(walls){scene.remove(walls);walls.dispose();}
  let cnt=0;for(const r of grid)for(const c of r)cnt+=c;
  walls=new THREE.InstancedMesh(wallGeo,wallMat,cnt);
  walls.castShadow=walls.receiveShadow=true;
  const m=new THREE.Matrix4(),col=new THREE.Color();let k=0;
  for(let z=0;z<S;z++)for(let x=0;x<S;x++)if(grid[z][x]){
    m.makeTranslation(cx(x),.7,cx(z));walls.setMatrixAt(k,m);
    col.setHSL(.7+(x+z)/S*.15,.6,.6);walls.setColorAt(k++,col);}
  scene.add(walls);
  const size=S*W;
  floor.scale.set(size+20,size+20,1);floorTex.repeat.set((size+20)/W,(size+20)/W);
  const sc=sun.shadow.camera;sc.left=sc.bottom=-size/2-2;sc.right=sc.top=size/2+2;sc.far=size*3;sc.updateProjectionMatrix();
  sun.position.set(size*.4,size,size*.6);
  ball.position.set(cx(1),R,cx(1));state.vel.set(0,0,0);
  goalPos.set(cx(S-2),0,cx(S-2));goal.position.copy(goalPos);
  gems.forEach(g=>{g.visible=false;});gems=[];
  const open=[];for(let z=1;z<S-1;z++)for(let x=1;x<S-1;x++)if(!grid[z][x]&&(x+z>4)&&!(x===S-2&&z===S-2))open.push([x,z]);
  for(let i=0;i<n+2&&open.length;i++){
    const [x,z]=open.splice(Math.random()*open.length|0,1)[0];
    let g=gemPool[i];if(!g){g=new THREE.Mesh(gemGeo,gemMat);g.castShadow=true;scene.add(g);gemPool.push(g);}
    g.visible=true;g.position.set(cx(x),.6,cx(z));gems.push(g);
  }
  state.time=25+n*5;
  camera.position.set(ball.position.x,14,ball.position.z+9);
  updateHUD();
}

function updateHUD(){
  $('lv').textContent='STAGE '+state.level;
  $('time').textContent='⏱ '+Math.ceil(state.time);
  $('time').classList.toggle('warn',state.time<10);
  $('sc').textContent='SCORE '+state.score;
  $('hi').textContent='HI '+state.hi;
}
let msgT=0;
function showMsg(t){$('msg').textContent=t;$('msg').style.opacity=1;msgT=1.5;}

function start(){
  initAudio();if(ac.state==='suspended')ac.resume();
  if(state.mode==='title'||state.mode==='over'){state.level=1;state.score=0;}
  buildLevel();state.mode='play';$('overlay').style.display='none';
  showMsg('STAGE '+state.level);
}
$('overlay').addEventListener('click',start);

// 入力
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;if((e.code==='Space'||e.code==='Enter')&&state.mode!=='play'&&state.mode!=='clear')start();});
addEventListener('keyup',e=>keys[e.code]=false);
const joy={on:false,ox:0,oy:0,x:0,y:0,id:null};
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{if(state.mode!=='play')return;joy.on=true;joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;
  $('joy').style.display='block';$('joy').style.left=e.clientX+'px';$('joy').style.top=e.clientY+'px';$('knob').style.transform='';});
addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const l=Math.hypot(dx,dy),mx=50;if(l>mx){dx*=mx/l;dy*=mx/l;}
  joy.x=dx/mx;joy.y=dy/mx;$('knob').style.transform=`translate(${dx}px,${dy}px)`;});
const endJoy=e=>{if(e.pointerId!==joy.id)return;joy.on=false;joy.x=joy.y=0;$('joy').style.display='none';};
addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);

// 衝突
function collide(){
  const p=ball.position,v=state.vel,ci=toCell(p.x),cj=toCell(p.z);
  for(let z=cj-1;z<=cj+1;z++)for(let x=ci-1;x<=ci+1;x++){
    if(z<0||x<0||z>=S||x>=S||!grid[z][x])continue;
    const wx=cx(x),wz=cx(z),h=W/2;
    const qx=Math.max(wx-h,Math.min(p.x,wx+h)),qz=Math.max(wz-h,Math.min(p.z,wz+h));
    let dx=p.x-qx,dz=p.z-qz;const d=Math.hypot(dx,dz);
    if(d<R&&d>1e-6){
      dx/=d;dz/=d;p.x+=dx*(R-d);p.z+=dz*(R-d);
      const vn=v.x*dx+v.z*dz;
      if(vn<0){if(vn<-2){sfx.bump(-vn);burst(new THREE.Vector3(qx,.4,qz),0xbbaaff,5,2);}
        v.x-=1.5*vn*dx;v.z-=1.5*vn*dz;}
    }
  }
}

const axis=new THREE.Vector3(),q=new THREE.Quaternion(),camTarget=new THREE.Vector3(),look=new THREE.Vector3();
let lastTick=0;
const clock=new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(state.mode==='play'){
    let ix=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+joy.x;
    let iz=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+joy.y;
    const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il;}
    const v=state.vel;
    v.x+=ix*22*dt;v.z+=iz*22*dt;
    v.multiplyScalar(Math.pow(.25,dt));
    const sp=v.length();if(sp>9)v.multiplyScalar(9/sp);
    const steps=3;
    for(let s=0;s<steps;s++){ball.position.x+=v.x*dt/steps;ball.position.z+=v.z*dt/steps;collide();}
    const spd=v.length();
    if(spd>.01){axis.set(v.z,0,-v.x).normalize();q.setFromAxisAngle(axis,spd*dt/R);ball.quaternion.premultiply(q);}
    if(rollGain){rollGain.gain.setTargetAtTime(Math.min(spd/9,1)*.12,ac.currentTime,.05);rollFilter.frequency.setTargetAtTime(150+spd*80,ac.currentTime,.05);}

    for(const g of gems){
      if(!g.visible)continue;
      if(g.position.distanceTo(ball.position)<R+.4){
        g.visible=false;state.score+=100;state.time+=3;sfx.gem();burst(g.position,0x7df9ff,18,5);
      }
    }
    state.time-=dt;
    if(state.time<10&&Math.ceil(state.time)!==lastTick){lastTick=Math.ceil(state.time);sfx.tick();}
    if(Math.hypot(ball.position.x-goalPos.x,ball.position.z-goalPos.z)<.8){
      state.mode='clear';const bonus=500+Math.ceil(state.time)*10;state.score+=bonus;
      sfx.goal();showMsg('GOAL! +'+bonus);
      for(let i=0;i<4;i++)setTimeout(()=>burst(goalPos.clone().setY(1),[0xffd86b,0xff7de9,0x7df9ff][i%3],25,7),i*150);
      if(rollGain)rollGain.gain.setTargetAtTime(0,ac.currentTime,.05);
      setTimeout(()=>{state.level++;buildLevel();state.mode='play';showMsg('STAGE '+state.level);},2000);
    }else if(state.time<=0){
      state.time=0;state.mode='over';sfx.over();
      if(rollGain)rollGain.gain.setTargetAtTime(0,ac.currentTime,.05);
      state.hi=Math.max(state.hi,state.score);
      $('overlay').innerHTML=`<h1>TIME UP!</h1><p>STAGE ${state.level} まで到達</p><p style="font-size:28px">SCORE ${state.score}</p><p>HI SCORE ${state.hi}</p><div class="btn">タップでリトライ</div>`;
      setTimeout(()=>$('overlay').style.display='flex',600);
    }
    if(state.score>state.hi)state.hi=state.score;
    updateHUD();
  }
  // 演出
  ballLight.position.copy(ball.position).y+=.8;
  ring.scale.setScalar(1+Math.sin(t*4)*.1);star.rotation.y=t*2;star.position.y=1.2+Math.sin(t*3)*.2;
  for(const g of gems){g.rotation.y=t*3;g.position.y=.6+Math.sin(t*3+g.position.x)*.12;}
  for(const p of parts){if(p.life<=0)continue;p.life-=dt*1.2;p.v.y-=9*dt;p.m.position.addScaledVector(p.v,dt);
    p.m.rotation.x+=dt*5;p.m.material.opacity=Math.max(p.life,0);if(p.life<=0)p.m.visible=false;}
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}
  if(state.mode==='title'){
    camera.position.set(Math.sin(t*.2)*14,12,Math.cos(t*.2)*14);camera.lookAt(0,0,0);
  }else{
    camTarget.set(ball.position.x+state.vel.x*.3,11,ball.position.z+7+state.vel.z*.3);
    camera.position.lerp(camTarget,1-Math.pow(.02,dt));
    look.lerp(ball.position,1-Math.pow(.001,dt));camera.lookAt(look);
  }
  renderer.render(scene,camera);
}
buildLevel();
loop();
</script>
</body>
</html>
