function gen(){

const plM=std({color:0xff8a3d}),whM=std({color:0xffffff}),bkM=std({color:0x111111}),ftM=std({color:0x8b3a12}),lfM=std({color:0x3ccf4e});

function build(){
  levelGroup.clear();tiles={};enemies=[];coins=[];gen();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=grid[y][x];if(c===' ')continue;
    const m=new THREE.Mesh(boxG,c==='#'&&grid[y+1][x]!=='#'?M.G:M[c]);m.position.set(x+.5,y+.5,0);
    if(c==='P'&&grid[y+1][x]!=='P')m.scale.set(1.08,1,1.15);

  for(let z=-1;z>=-3;z--)for(let x=0;x<W;x++)if(grid[1][x]==='#'){const m=new THREE.Mesh(boxG,M.G);m.position.set(x+.5,1.5,z);m.receiveShadow=true;levelGroup.add(m);}

  coinsDef.forEach(([x,y])=>{const m=new THREE.Mesh(coinG,coinM);m.position.set(x,y,0);m.castShadow=true;levelGroup.add(m);coins.push({x,y,mesh:m,alive:true});});
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,10),poleM);pole.position.set(flagX+.5,8,0);levelGroup.add(pole);
  const ball=new THREE.Mesh(sphG,coinM);ball.scale.setScalar(.25);ball.position.set(flagX+.5,13.1,0);levelGroup.add(ball);

  for(let i=0;i<5;i+=2){const t=new THREE.Mesh(boxG,cm);t.scale.set(.9,.8,3);t.position.set(-2+i,6.4,0);cas.add(t);}
  const top=new THREE.Mesh(boxG,cm);top.scale.set(2.4,2,2.4);top.position.y=7;cas.add(top);
  const door=new THREE.Mesh(boxG,bkM);door.scale.set(1.2,1.8,.1);door.position.set(0,2.9,1.51);cas.add(door);

const pm=new THREE.Group();scene.add(pm);
const body=new THREE.Mesh(sphG,plM);body.scale.set(.42,.45,.4);body.position.y=.47;body.castShadow=true;pm.add(body);
const belly=new THREE.Mesh(sphG,whM);belly.scale.set(.28,.28,.25);belly.position.set(.2,.38,0);pm.add(belly);
for(const z of[-.14,.14]){const e=new THREE.Mesh(sphG,whM);e.scale.setScalar(.11);e.position.set(.3,.6,z);pm.add(e);const p=new THREE.Mesh(sphG,bkM);p.scale.setScalar(.06);p.position.set(.39,.6,z);pm.add(p);}
const feet=[-.15,.15].map(z=>{const f=new THREE.Mesh(boxG,ftM);f.scale.set(.3,.14,.2);f.position.set(.05,.07,z);f.castShadow=true;pm.add(f);return f;});
const leaf=new THREE.Mesh(sphG,lfM);leaf.scale.set(.2,.06,.1);leaf.position.set(-.05,.98,0);leaf.rotation.z=.5;pm.add(leaf);
const p={x:3,y:2,vx:0,vy:0,w:.7,h:.9,onGround:false,face:1};
const parts=[];for(let i=0;i<70;i++){const m=new THREE.Mesh(boxG,M.B);m.scale.setScalar(.22);m.visible=false;scene.add(m);parts.push({m,life:0,vx:0,vy:0});}

let ac;function tone(f,d,type='square',f2,v=.08,delay=0){if(!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);}

const mel=[392,0,523,0,659,523,587,0,494,0,587,0,523,0,440,494,392,0,523,0,659,784,880,0,784,659,587,523,494,0,392,0],bass=[131,196,175,196,131,196,147,196];let step=0;

function toShell(e){e.type='shell';e.vx=0;e.h=.6;e.grace=.25;e.parts.forEach(m=>m.visible=false);e.body.position.y=.32;e.rim.position.y=.16;addScore(100);sfx.stomp();burst(e.x,e.y+.4,shM,4,3);}
let msgT=0;function flash(s){$('msg').textContent=s;$('msg').style.opacity=1;msgT=1;}
const overlap=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&a.y<b.y+b.h&&a.y+a.h>b.y;
let state='title',score=0,coinCount=0,lives=3,world=1,time=300,hi=0,timer=0,camX=9,btnAct;
const addScore=n=>score+=n;
function showOverlay(t,msg,b,act){$('overlay').style.display='flex';$('overlay').querySelector('h1').innerHTML=t;$('overlay').querySelector('p').innerHTML=msg;$('btn').textContent=b;btnAct=act;}
$('btn').onclick=()=>{if(!ac){ac=new AudioContext();}ac.resume();btnAct();};
btnAct=()=>{score=0;coinCount=0;lives=3;world=1;startLevel();};
function startLevel(){build();Object.assign(p,{x:3,y:2,vx:0,vy:0,face:1});pm.visible=true;pm.scale.set(1,1,1);time=300;timer=0;camX=9;state='play';$('overlay').style.display='none';}
function die(){if(state!=='play')return;state='dead';timer=0;p.vy=15;sfx.die();}
function updateEnemy(e,dt){
  if(e.type==='shell'&&e.vx&&Math.abs(e.x-camX)>22){e.alive=false;e.mesh.visible=false;return;}
  if(e.x>camX+16||e.x<camX-24)return;
  e.grace-=dt;e.t+=dt;
  if(e.type==='fly'){const nx=e.x0+Math.sin(e.t*.9)*2.5;e.vx=(nx-e.x)/dt;e.x=nx;e.y=e.y0+Math.sin(e.t*2.2)*1.5;}
  else{e.vy-=50*dt;const d=e.vx;if(moveX(e,dt)){e.vx=-d;if(e.type==='shell')sfx.thud();}else e.vx=d;moveY(e,dt);if(e.y<-4){e.alive=false;return;}}
  if(e.type==='shell'&&e.vx)for(const o of enemies)if(o!==e&&o.alive&&overlap(e,o)){e.combo++;defeat(o,true,100*2**Math.min(e.combo,6));sfx.combo(e.combo);if(e.combo>1)flash(e.combo+'コンボ！ +'+100*2**Math.min(e.combo,6));}
  if(state!=='play'||e.grace>0||!overlap(e,p))return;
  const stomp=p.vy<0&&p.y>e.y+e.h*.35,bounce=()=>p.vy=key.j?15:10;
  if(e.type==='shell'){
    if(!e.vx){e.vx=p.x<e.x?11:-11;e.grace=.25;e.combo=0;sfx.kick();addScore(100);burst(e.x,e.y+.3,coinM,4,4);if(stomp)bounce();}
    else if(stomp){e.vx=0;e.grace=.2;sfx.stomp();bounce();}
    else die();
  }else if(stomp){if(e.type==='turtle')toShell(e);else defeat(e,e.type==='fly');bounce();}
  else die();
}
function update(dt,t){
  if(state==='play'){
    time-=dt*2.5;if(time<=0){time=0;die();}
    const dir=(key.r?1:0)-(key.l?1:0),max=key.d?9.5:6,acc=p.onGround?(dir?28:22):16;
    const dv=dir*max-p.vx;p.vx+=Math.max(-acc*dt,Math.min(acc*dt,dv));if(dir)p.face=dir;
    p.coyote=p.onGround?.1:(p.coyote||0)-dt;jumpBuf-=dt;
    if(jumpBuf>0&&p.coyote>0){p.vy=14.5+Math.abs(p.vx)*.25;jumpBuf=0;p.coyote=0;sfx.jump();burst(p.x,p.y,grassTop,4,3);}
    p.vy-=(p.vy>0&&key.j?30:62)*dt;p.vy=Math.max(p.vy,-22);
    if(moveX(p,dt))p.vx=0;moveY(p,dt);
    if(p.y<-3)die();
    for(const c of coins)if(c.alive&&Math.abs(c.x-p.x)<.6&&Math.abs(c.y-(p.y+.45))<.8){c.alive=false;c.mesh.visible=false;coinCount++;addScore(100);sfx.coin();burst(c.x,c.y,coinM,5,4);}
    if(p.x>=flagX+.2){state='clear';timer=0;p.x=flagX+.2;p.vx=0;p.vy=0;sfx.clear();addScore(Math.max(0,Math.floor((p.y-2)*400)));}
  }else if(state==='dead'){
    timer+=dt;if(timer>.5){p.vy-=40*dt;p.y+=p.vy*dt;}
    if(timer>2.5){lives--;if(lives>0)startLevel();else{state='over';hi=Math.max(hi,score);showOverlay('GAME OVER',`SCORE ${score}<br>HIGH SCORE ${hi}`,'リトライ',()=>{score=0;coinCount=0;lives=3;world=1;startLevel();});}}
  }else if(state==='clear'){
    timer+=dt;
    if(p.y>2.01||flag.position.y>3.2){p.y=Math.max(2,p.y-7*dt);flag.position.y=Math.max(3.2,flag.position.y-7*dt);}
    else{p.vx=4;p.face=1;p.vy-=50*dt;moveX(p,dt);moveY(p,dt);
      if(p.x>castleX){pm.visible=false;if(!p.bonus){p.bonus=1;addScore(Math.floor(time)*10);}}}
    if(timer>4.5&&state==='clear'){state='wait';p.bonus=0;hi=Math.max(hi,score);showOverlay(`WORLD ${world} クリア！`,`SCORE ${score}<br>HIGH SCORE ${hi}`,'次のワールドへ',()=>{world++;startLevel();});}
  }
  if(state==='play'||state==='clear')for(const e of enemies)if(e.alive)updateEnemy(e,dt);
  for(const e of enemies){
    if(e.dead){e.dead+=dt;if(e.flip){e.vy-=30*dt;e.y+=e.vy*dt;e.mesh.rotation.z=Math.PI;}else e.mesh.scale.set(1.3,.25,1.3);if(e.dead>1.2)e.mesh.visible=false;}
    e.mesh.position.set(e.x,e.y+(e.flip&&e.dead?.7:0),0);
    if(!e.alive)continue;
    if(e.type==='shell'){if(e.vx)e.mesh.rotation.y+=dt*18;}
    else{if(Math.abs(e.vx)>.05)e.mesh.rotation.y=e.vx>0?-.5:Math.PI+.5;e.body.scale.y=e.by+Math.sin(t*12+e.t)*.03;}
    if(e.wings)e.wings.forEach(w=>w.rotation.x=w.userData.s*Math.sin(t*22)*.7);
  }
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}
  for(const c of coins)if(c.alive){c.mesh.rotation.y=t*3;c.mesh.position.y=c.y+Math.sin(t*3+c.x)*.08;}
  for(let i=bumps.length-1;i>=0;i--){const b=bumps[i];b.t+=dt;b.m.position.y=b.y+Math.sin(Math.min(b.t/.2,1)*Math.PI)*.35;if(b.t>.2)bumps.splice(i,1);}
  for(let i=pops.length-1;i>=0;i--){const q=pops[i];q.t+=dt;q.vy-=30*dt;q.m.position.y+=q.vy*dt;q.m.rotation.y+=dt*20;if(q.t>.6){scene.remove(q.m);pops.splice(i,1);}}
  for(const q of parts)if(q.life>0){q.life-=dt*1.2;q.vy-=25*dt;q.m.position.x+=q.vx*dt;q.m.position.y+=q.vy*dt;q.m.rotation.x+=dt*8;q.m.scale.setScalar(.22*Math.max(q.life,0));if(q.life<=0)q.m.visible=false;}
  pm.position.set(p.x,p.y,0);
  pm.rotation.y=THREE.MathUtils.lerp(pm.rotation.y,p.face>0?-.5:Math.PI+.5,.25);
  const moving=Math.abs(p.vx)>.5&&p.onGround;
  feet[0].position.x=.05+(moving?Math.sin(t*20)*.15:0);feet[1].position.x=.05-(moving?Math.sin(t*20)*.15:0);
  const st=p.onGround?1:1+Math.min(Math.abs(p.vy)*.015,.15);body.scale.set(.42/st,.45*st,.4/st);
  if(state==='dead')pm.rotation.z+=dt*8;else pm.rotation.z=0;
  if(state==='play'||state==='clear')camX=THREE.MathUtils.lerp(camX,Math.min(Math.max(p.x+2,9),W-9),.1);
  camera.position.set(camX,7.5,18);camera.lookAt(camX,5.8,0);
  sun.position.set(camX+6,16,10);sun.target.position.set(camX,2,0);
  $('hs').textContent='SCORE '+String(score).padStart(6,'0');$('hc').textContent='🪙×'+String(coinCount).padStart(2,'0');
  $('hw').textContent='WORLD '+world;$('ht').textContent='TIME '+Math.ceil(time);$('hl').textContent='❤×'+lives;
}
build();
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.033);update(dt,clock.elapsedTime);renderer.render(scene,camera);});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
