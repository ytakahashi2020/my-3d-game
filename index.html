<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STAR RUNNER</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;color:#fff;touch-action:none;user-select:none}
#hud{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:20px;font-weight:bold;text-shadow:0 0 8px #0ff;pointer-events:none}
#combo{position:fixed;top:50px;width:100%;text-align:center;font-size:22px;color:#ffd84a;text-shadow:0 0 10px #fa0;pointer-events:none;opacity:0;transition:opacity .3s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(#0a1440cc,#000c);text-align:center;cursor:pointer}
.ov h1{font-size:clamp(36px,9vw,72px);letter-spacing:4px;background:linear-gradient(#fff,#6cf,#a6f);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #39f)}
.ov p{margin:10px;font-size:17px;opacity:.9;line-height:1.6}
.btn{margin-top:20px;padding:14px 40px;border:2px solid #6cf;border-radius:40px;font-size:22px;box-shadow:0 0 20px #39f;animation:p 1.2s infinite}
@keyframes p{50%{transform:scale(1.08)}}
.hide{display:none}
</style>
</head>
<body>
<div id="hud"><div>SCORE <span id="sc">0</span></div><div id="lv">❤❤❤</div><div>HI <span id="hi">0</span></div></div>
<div id="combo"></div>
<div id="start" class="ov"><h1>STAR RUNNER</h1><p>隕石をよけて ⭐ を集めよう！<br>弾はオートで発射、隕石を壊すとボーナス<br>PC: 矢印キー / WASD　スマホ: ドラッグ</p><div class="btn">クリック / タップでスタート</div></div>
<div id="over" class="ov hide"><h1>GAME OVER</h1><p id="res"></p><div class="btn">もう一度あそぶ</div></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02030a);
scene.fog=new THREE.Fog(0x02030a,60,130);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,300);
camera.position.set(0,2.5,9);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

scene.add(new THREE.HemisphereLight(0x88aaff,0x221133,1.2));
const sun=new THREE.DirectionalLight(0xffeedd,2.5);sun.position.set(5,10,6);scene.add(sun);
const engineLight=new THREE.PointLight(0x33ccff,30,12);scene.add(engineLight);

// 背景の星（流れる）
const SN=2500,sPos=new Float32Array(SN*3);
for(let i=0;i<SN;i++){sPos[i*3]=(Math.random()-.5)*200;sPos[i*3+1]=(Math.random()-.5)*120;sPos[i*3+2]=-Math.random()*200}
const sGeo=new THREE.BufferGeometry();sGeo.setAttribute('position',new THREE.BufferAttribute(sPos,3));
const bgStars=new THREE.Points(sGeo,new THREE.PointsMaterial({color:0xffffff,size:0.35,sizeAttenuation:true}));
scene.add(bgStars);
// 星雲
const nebC=document.createElement('canvas');nebC.width=nebC.height=256;const nx=nebC.getContext('2d');
const g=nx.createRadialGradient(128,128,0,128,128,128);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(0,0,0,0)');nx.fillStyle=g;nx.fillRect(0,0,256,256);
const glowTex=new THREE.CanvasTexture(nebC);
[[0x6633ff,-60,20],[0x0088ff,70,-10],[0xff3399,10,35]].forEach(([c,x,y])=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,transparent:true,opacity:.25,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));s.position.set(x,y,-180);s.scale.set(150,150,1);scene.add(s)});

// 自機
const ship=new THREE.Group();
const bodyMat=new THREE.MeshStandardMaterial({color:0xe8eeff,metalness:.6,roughness:.3});
const accMat=new THREE.MeshStandardMaterial({color:0x2277ff,metalness:.5,roughness:.3,emissive:0x0a2266});
const body=new THREE.Mesh(new THREE.ConeGeometry(0.45,2.2,8),bodyMat);body.rotation.x=-Math.PI/2;ship.add(body);
const cockpit=new THREE.Mesh(new THREE.SphereGeometry(0.3,16,12),new THREE.MeshStandardMaterial({color:0x66ddff,emissive:0x1188aa,metalness:.2,roughness:.1}));
cockpit.position.set(0,0.25,-0.1);cockpit.scale.set(1,.7,1.6);ship.add(cockpit);
const wing=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.08,0.8),accMat);wing.position.z=0.5;ship.add(wing);
[-1,1].forEach(s=>{const f=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.6,0.6),accMat);f.position.set(s*1.4,0.25,0.6);ship.add(f)});
const flame=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0x44ccff,blending:THREE.AdditiveBlending,depthWrite:false}));
flame.position.z=1.3;flame.scale.set(1.2,1.2,1);ship.add(flame);
scene.add(ship);

// 隕石
const meteorGeos=[0,1,2].map(k=>{const geo=new THREE.IcosahedronGeometry(1,1);const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const v=new THREE.Vector3().fromBufferAttribute(p,i);v.multiplyScalar(0.75+Math.random()*0.45);p.setXYZ(i,v.x,v.y,v.z)}
  geo.computeVertexNormals();return geo});
const meteorMat=new THREE.MeshStandardMaterial({color:0x8a6a55,roughness:.95,flatShading:true});
const meteors=[];
for(let i=0;i<28;i++){const m=new THREE.Mesh(meteorGeos[i%3],meteorMat.clone());m.visible=false;scene.add(m);
  meteors.push({m,active:false,r:1,hp:1,spd:0,rot:new THREE.Vector3(),flash:0})}

// 収集用の星
const sh=new THREE.Shape();
for(let i=0;i<10;i++){const a=i/10*Math.PI*2+Math.PI/2,r=i%2?0.38:0.9;i?sh.lineTo(Math.cos(a)*r,Math.sin(a)*r):sh.moveTo(Math.cos(a)*r,Math.sin(a)*r)}
const starGeo=new THREE.ExtrudeGeometry(sh,{depth:0.25,bevelEnabled:true,bevelSize:0.08,bevelThickness:0.08,bevelSegments:1});starGeo.center();
const starMat=new THREE.MeshStandardMaterial({color:0xffd84a,emissive:0xffaa00,emissiveIntensity:.9,metalness:.4,roughness:.2});
const stars=[];
for(let i=0;i<12;i++){const s=new THREE.Mesh(starGeo,starMat);const gl=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xffcc33,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.7,transparent:true}));
  gl.scale.set(3,3,1);s.add(gl);s.visible=false;scene.add(s);stars.push({m:s,active:false,spd:0})}

// 弾
const bulletGeo=new THREE.CapsuleGeometry(0.08,0.8,4,8);bulletGeo.rotateX(Math.PI/2);
const bulletMat=new THREE.MeshBasicMaterial({color:0x66ffff});
const bullets=[];
for(let i=0;i<40;i++){const b=new THREE.Mesh(bulletGeo,bulletMat);b.visible=false;scene.add(b);bullets.push({m:b,active:false})}

// パーティクル
const PN=600,pPos=new Float32Array(PN*3),pCol=new Float32Array(PN*3),pVel=new Float32Array(PN*3),pLife=new Float32Array(PN);
const pGeo=new THREE.BufferGeometry();
pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));pGeo.setAttribute('color',new THREE.BufferAttribute(pCol,3));
const parts=new THREE.Points(pGeo,new THREE.PointsMaterial({size:0.5,map:glowTex,vertexColors:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
parts.frustumCulled=false;scene.add(parts);
let pIdx=0;const tmpC=new THREE.Color();
function burst(pos,color,n,spd){tmpC.set(color);
  for(let k=0;k<n;k++){const i=pIdx=(pIdx+1)%PN;const v=new THREE.Vector3().randomDirection().multiplyScalar(spd*(0.3+Math.random()));
    pPos.set([pos.x,pos.y,pos.z],i*3);pVel.set([v.x,v.y,v.z],i*3);pCol.set([tmpC.r,tmpC.g,tmpC.b],i*3);pLife[i]=0.6+Math.random()*0.6}}
function updateParts(dt){for(let i=0;i<PN;i++){if(pLife[i]<=0)continue;pLife[i]-=dt;const f=pLife[i]>0?Math.min(1,pLife[i]*1.5):0;
  for(let a=0;a<3;a++){pPos[i*3+a]+=pVel[i*3+a]*dt;pVel[i*3+a]*=0.96;pCol[i*3+a]*=f<1?0.95:1}
  if(pLife[i]<=0)pPos[i*3+1]=9999}
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.color.needsUpdate=true}
pPos.fill(9999);

// 音
let ac;
function tone(f1,f2,dur,type='sine',vol=.2,noise=false){if(!ac)return;const t=ac.currentTime,gn=ac.createGain();
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.001,t+dur);gn.connect(ac.destination);
  if(noise){const buf=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=ac.createBufferSource();s.buffer=buf;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(f1,t);fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
    s.connect(fl);fl.connect(gn);s.start(t);return}
  const o=ac.createOscillator();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);o.connect(gn);o.start(t);o.stop(t+dur)}
const sfx={
  shot:()=>tone(1200,300,0.08,'square',0.03),
  star:(c)=>{const b=660*Math.pow(1.06,Math.min(c,12));tone(b,b*1.5,0.15,'triangle',0.15);setTimeout(()=>tone(b*1.5,b*2,0.2,'sine',0.12),70)},
  boom:()=>tone(1500,60,0.5,'sine',0.35,true),
  hit:()=>{tone(300,40,0.6,'sawtooth',0.25);tone(800,50,0.7,'sine',0.3,true)},
  over:()=>[440,330,220].forEach((f,i)=>setTimeout(()=>tone(f,f*.9,0.4,'triangle',0.2),i*200))
};

// 入力
const keys={};
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
let pointer=null;
renderer.domElement.addEventListener('pointerdown',e=>pointer={x:e.clientX,y:e.clientY});
addEventListener('pointermove',e=>{if(pointer){pointer.x=e.clientX;pointer.y=e.clientY}});
addEventListener('pointerup',()=>pointer=null);

// ゲーム状態
const BX=6.5,BY=3.8;
let state='title',score=0,hi=0,lives=3,speed=30,time=0,inv=0,fireT=0,spawnM=0,spawnS=0,combo=0,comboT=0,shake=0;
const vel=new THREE.Vector2();
function updateHUD(){$('sc').textContent=score;$('hi').textContent=hi;$('lv').textContent='❤'.repeat(lives)+'♡'.repeat(Math.max(0,3-lives))}
function start(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();
  score=0;lives=3;speed=30;time=0;inv=1;combo=0;comboT=0;
  meteors.forEach(o=>{o.active=false;o.m.visible=false});stars.forEach(o=>{o.active=false;o.m.visible=false});bullets.forEach(o=>{o.active=false;o.m.visible=false});
  ship.position.set(0,0,0);ship.visible=true;vel.set(0,0);
  $('start').classList.add('hide');$('over').classList.add('hide');state='play';updateHUD();
}
$('start').addEventListener('click',start);$('over').addEventListener('click',start);
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&state!=='play')start()});
function gameOver(){state='over';hi=Math.max(hi,score);ship.visible=false;burst(ship.position,0x66ccff,120,18);burst(ship.position,0xffaa33,80,12);sfx.over();
  setTimeout(()=>{$('res').innerHTML=`SCORE: ${score}<br>HI SCORE: ${hi}`;$('over').classList.remove('hide')},900);updateHUD()}

function spawnMeteor(){const o=meteors.find(o=>!o.active);if(!o)return;
  const big=Math.random()<0.3;o.r=big?1.8:0.8+Math.random()*0.5;o.hp=big?3:1;o.m.scale.setScalar(o.r);
  o.m.position.set((Math.random()-.5)*BX*2.4,(Math.random()-.5)*BY*2.4,-130);
  if(Math.random()<0.25){o.m.position.x=ship.position.x+(Math.random()-.5)*2;o.m.position.y=ship.position.y+(Math.random()-.5)*2}
  o.spd=speed*(0.8+Math.random()*0.5);o.rot.set(Math.random()*2,Math.random()*2,Math.random()*2);
  o.m.material.color.setHSL(0.06+Math.random()*0.04,0.3,0.3+Math.random()*0.15);o.m.material.emissive.set(0);
  o.active=true;o.m.visible=true}
function spawnStar(){const o=stars.find(o=>!o.active);if(!o)return;
  o.m.position.set((Math.random()-.5)*BX*1.8,(Math.random()-.5)*BY*1.8,-130);o.spd=speed;o.active=true;o.m.visible=true}
function fire(){const b=bullets.find(o=>!o.active);if(!b)return;b.m.position.copy(ship.position);b.m.position.z-=1.2;b.active=true;b.m.visible=true;sfx.shot()}
function showCombo(){const c=$('combo');if(combo>1){c.textContent=`COMBO x${combo}!`;c.style.opacity=1}else c.style.opacity=0}

const clock=new THREE.Clock();
const camTarget=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  const playing=state==='play';
  const flow=playing?speed:12;
  for(let i=0;i<SN;i++){sPos[i*3+2]+=flow*1.5*dt;if(sPos[i*3+2]>10)sPos[i*3+2]-=200}
  sGeo.attributes.position.needsUpdate=true;

  if(playing){
    time+=dt;speed=30+time*0.8;
    // 移動
    const ix=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
    const iy=(keys.ArrowUp||keys.KeyW?1:0)-(keys.ArrowDown||keys.KeyS?1:0);
    if(pointer){const tx=(pointer.x/innerWidth*2-1)*BX,ty=-(pointer.y/innerHeight*2-1)*BY;
      vel.set((tx-ship.position.x)*8,(ty-ship.position.y)*8)}
    else{vel.x+=(ix*14-vel.x)*Math.min(1,dt*8);vel.y+=(iy*10-vel.y)*Math.min(1,dt*8)}
    ship.position.x=THREE.MathUtils.clamp(ship.position.x+vel.x*dt,-BX,BX);
    ship.position.y=THREE.MathUtils.clamp(ship.position.y+vel.y*dt,-BY,BY);
    ship.rotation.z=THREE.MathUtils.lerp(ship.rotation.z,-vel.x*0.06,0.15);
    ship.rotation.x=THREE.MathUtils.lerp(ship.rotation.x,vel.y*0.04,0.15);
    inv-=dt;ship.visible=inv>0?Math.floor(inv*12)%2===0:true;
    // 発射
    fireT-=dt;if(fireT<=0){fire();fireT=0.16}
    // 出現
    spawnM-=dt;if(spawnM<=0){spawnMeteor();spawnM=Math.max(0.18,0.7-time*0.01)}
    spawnS-=dt;if(spawnS<=0){spawnStar();spawnS=0.9+Math.random()*0.8}
    comboT-=dt;if(comboT<=0&&combo){combo=0;showCombo()}
  }
  flame.scale.setScalar(1+Math.random()*0.4);
  engineLight.position.set(ship.position.x,ship.position.y,ship.position.z+1.5);

  for(const b of bullets){if(!b.active)continue;b.m.position.z-=80*dt;if(b.m.position.z<-130){b.active=false;b.m.visible=false}}
  for(const o of meteors){if(!o.active)continue;const p=o.m.position;
    p.z+=o.spd*dt;o.m.rotation.x+=o.rot.x*dt;o.m.rotation.y+=o.rot.y*dt;
    if(o.flash>0){o.flash-=dt;o.m.material.emissive.setRGB(o.flash*4,o.flash*2,0)}
    if(p.z>12){o.active=false;o.m.visible=false;continue}
    for(const b of bullets){if(!b.active)continue;
      if(b.m.position.distanceToSquared(p)<(o.r+0.4)**2){b.active=false;b.m.visible=false;o.hp--;o.flash=0.15;burst(b.m.position,0x88ffff,6,6);
        if(o.hp<=0){o.active=false;o.m.visible=false;burst(p,0xff9944,30+o.r*20,10*o.r);burst(p,0xffee88,15,6);sfx.boom();
          if(playing){score+=o.r>1.5?150:50;updateHUD()}break}}}
    if(o.active&&playing&&inv<=0&&p.distanceToSquared(ship.position)<(o.r*0.85+0.7)**2){
      o.active=false;o.m.visible=false;burst(p,0xff6633,50,12);sfx.hit();shake=0.6;lives--;combo=0;showCombo();updateHUD();
      if(lives<=0)gameOver();else inv=2}}
  for(const o of stars){if(!o.active)continue;const p=o.m.position;
    p.z+=o.spd*dt;o.m.rotation.y+=dt*3;
    if(p.z>12){o.active=false;o.m.visible=false;continue}
    if(playing&&p.distanceToSquared(ship.position)<1.8**2){o.active=false;o.m.visible=false;
      combo++;comboT=2.5;score+=100*combo;sfx.star(combo);burst(p,0xffdd44,40,8);burst(p,0xffffff,15,5);showCombo();updateHUD()}}
  updateParts(dt);

  // カメラ
  camTarget.set(ship.position.x*0.5,ship.position.y*0.5+2.5,9);
  camera.position.lerp(camTarget,0.08);
  if(shake>0){shake-=dt;camera.position.x+=(Math.random()-.5)*shake;camera.position.y+=(Math.random()-.5)*shake}
  camera.lookAt(ship.position.x*0.3,ship.position.y*0.3,-12);
  camera.fov=THREE.MathUtils.lerp(camera.fov,playing?65+Math.min(20,time*0.3):65,0.05);camera.updateProjectionMatrix();
  if(state==='title'){ship.position.y=Math.sin(performance.now()*0.002)*0.3;ship.rotation.z=Math.sin(performance.now()*0.001)*0.2}
  renderer.render(scene,camera);
}
updateHUD();loop();
</script>
</body>
</html>
